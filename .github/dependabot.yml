version: 2

# Version-bump PRs are throttled to zero for the duration of the hackathon sprint —
# see the closed PRs #1-6, #42. Routine dependency bumps eat a teammate's limited
# review bandwidth for no benefit while the deadline is close. This does NOT disable
# Dependabot security alerts, which are a separate GitHub feature and keep firing
# regardless of this file.
#
# Re-enable after the deadline by raising open-pull-requests-limit back to 3 (or by
# just deleting this file and letting the defaults apply).
updates:
  # Actions get pinned by major tag, so this mostly catches deprecations before a
  # workflow starts failing on a runner image change.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
    # torch is pinned by what actually trains. An automated bump mid-build is a
    # distraction at best and a silent numerical change at worst.
    ignore:
      - dependency-name: torch
      - dependency-name: numpy
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
