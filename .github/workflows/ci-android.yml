name: CI · Android

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/ci-android.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
  workflow_dispatch:

concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/android

jobs:
  build:
    name: Assemble · lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # JDK 21, not 25. Gradle does not support 25 yet and the failure it produces is
      # obscure enough to cost an afternoon.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Committed from Windows the wrapper lands as mode 100644 and Linux refuses it.
      # Fixed permanently with `git update-index --chmod=+x apps/android/gradlew`;
      # this step is the guard against that being undone by a future checkout.
      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Android lint
        run: ./gradlew :app:lintDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: imu-streamer-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-lint-report
          path: apps/android/app/build/reports/
          retention-days: 7
