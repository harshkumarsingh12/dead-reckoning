name: PR hygiene

# Cheap checks that run on every PR regardless of what changed.
# OWNER: Sristee (the secret scan is hers; see CONTRIBUTING.md area 7)

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    # Dependabot writes its own titles ("chore: Update numpy requirement from ...")
    # and they are capitalised. The rule is for humans; exempting the bot is cheaper
    # and clearer than loosening the pattern for everyone.
    if: github.actor != 'dependabot[bot]'
    steps:
      # Squash-merge uses the PR title as the commit message, so this is what actually
      # decides whether the history reads well. A clean progressive history is scored.
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            chore
            refactor
            perf
            ci
          requireScope: false
          subjectPattern: '^[a-z].*[^.]$'
          subjectPatternError: |
            The subject "{subject}" must start lowercase and must not end with a period.
            Example: feat: fuse the learned velocity in the device frame

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs history to scan the whole diff range

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  large-files:
    name: No large files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Recordings, tiles and checkpoints do not belong in git. Once a large blob is
      # committed it is in the history forever and every clone pays for it, so this
      # blocks at the PR rather than asking for a rewrite afterwards.
      - name: Reject blobs over 5 MB
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          fail=0
          while read -r file; do
            [ -f "$file" ] || continue
            size=$(wc -c < "$file")
            if [ "$size" -gt 5242880 ]; then
              echo "::error file=$file::$((size / 1048576)) MB. Datasets, tiles and "\
                   "checkpoints are regenerated, not committed. See .gitignore."
              fail=1
            fi
          done < <(git diff --name-only "$base" "$head")
          exit $fail
