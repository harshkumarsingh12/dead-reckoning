name: Release

# Tag a milestone, get a downloadable bundle of everything that milestone produced.
# Useful for the SIH submission itself: a tagged artefact with a fixed commit behind
# it is much better evidence than "it works on the laptop".
#
#   git tag -a v0.3.0-m3 -m "M3: ESKF fusion"
#   git push origin v0.3.0-m3

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest -q

      # dr_core.__version__ reads installed package metadata (pyproject.toml's
      # [project].version), so this is really checking the TAG against
      # pyproject.toml, not against a second hardcoded literal -- there is no second
      # literal anymore. Skipped on workflow_dispatch: there is no tag to check.
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          tag_version="${tag_version%%-*}"  # v0.3.0-m3 -> 0.3.0
          pkg_version=$(python -c "import dr_core; print(dr_core.__version__)")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} implies version $tag_version but" \
                 "pyproject.toml's version is $pkg_version -- bump pyproject.toml in" \
                 "the same PR as (or before) tagging the release."
            exit 1
          fi

      # A pinned snapshot of exactly what CI verified this tag against. pyproject.toml
      # deliberately uses ranges (numpy<2.1, etc.), so "pip install -e ." on demo day
      # can resolve differently than it did here -- this file is what makes the
      # release reproducible rather than just tested-once.
      - name: Freeze the verified dependency set
        run: pip freeze --exclude-editable > requirements-lock.txt
      - uses: actions/upload-artifact@v4
        with:
          name: requirements-lock
          path: requirements-lock.txt

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble and lint
        working-directory: apps/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apps/android/app/build/outputs/apk/debug/*.apk

  web:
    name: Web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: apps/web/dist

  release:
    name: Publish
    needs: [verify, android, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.apk' -o -name '*.onnx' \) -exec cp {} release/ \;
          if [ -d artifacts/web ]; then
            tar -czf release/web-dist.tar.gz -C artifacts/web .
          fi
          if [ -f artifacts/requirements-lock/requirements-lock.txt ]; then
            cp artifacts/requirements-lock/requirements-lock.txt release/
          fi
          # Same practice docs/DEMO_RUNBOOK.md already uses by hand for the MBTiles
          # checksum -- an APK that gets side-loaded onto a phone is exactly the kind
          # of artifact worth being able to verify untampered.
          ( cd release && sha256sum * > checksums.txt )
          ls -lh release/

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
          body: |
            SIH26168 — GPS-denied pedestrian dead reckoning (ISRO).

            Attached: the IMU streamer APK, the offline demo web bundle,
            `requirements-lock.txt` (the exact dependency set CI verified this tag
            against — pyproject.toml uses ranges, this is the pinned reproduction of
            what was actually tested), and `checksums.txt` for all of the above.

            Map tiles and datasets are NOT attached — they are regenerated with
            `scripts/make_tiles.py` and `scripts/fetch_datasets.py`.

            Metrics for this tag are in `docs/EVALUATION.md`; setup is in
            `CONTRIBUTING.md`.
