name: CI · ML

# Split out from ci-python on purpose. Installing torch costs several minutes and
# ~2 GB; making every web or docs PR pay that is how a team learns to stop reading CI.
# This runs only when the model actually changes.
on:
  pull_request:
    paths:
      - 'src/dr_core/models/**'
      - 'scripts/train.py'
      - 'scripts/export_onnx.py'
      - '.github/workflows/ci-ml.yml'
  push:
    branches: [main]
    paths:
      - 'src/dr_core/models/**'
  workflow_dispatch:

concurrency:
  group: ci-ml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model:
    name: Model shapes · NLL · ONNX parity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # models/tcn.onnx (+.onnx.data) are LFS-tracked (.gitattributes). Without
      # lfs: true, checkout leaves the tiny pointer file on disk instead of the real
      # binary, and onnxruntime fails to load it with an opaque "Protobuf parsing
      # failed" -- not a missing-file error, so it looks like a corrupt model rather
      # than an untouched checkout flag.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      # CPU wheels only. The GPU build is ~4x the download and CI never trains here.
      - name: Install with the ml extra
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev,ml]"

      - name: Model tests
        run: pytest -m ml -v

      # Guards the claim we make on stage. If a refactor pushes inference over budget,
      # the number in the pitch quietly stops being true -- catch it here instead.
      - name: Inference budget (< 10 ms per window)
        run: pytest -m ml -k budget -v
