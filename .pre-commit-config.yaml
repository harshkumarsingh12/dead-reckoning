# Fast local guards. Everything here also runs in CI, so `--no-verify` only defers
# the failure — it does not avoid it.
#
#   pip install -e ".[dev]" && pre-commit install
default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      # Datasets, tiles and checkpoints are regenerated, never committed. Once a
      # large blob is in the history every clone pays for it forever.
      - id: check-added-large-files
        args: [--maxkb=5120]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pinned to match pyproject.toml's [dev] extra exactly (ruff==0.16.5) -- a hook
    # enforcing a different ruleset than the locally installed ruff means "ruff check .
    # is green" stops predicting "the commit will pass" (#63).
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # The contract tests are the ones that must never be red: they check the frozen
      # types and the dependency direction. Cheap enough to run on every commit.
      - id: contract
        name: frozen contract
        entry: pytest tests/test_contract.py -q
        language: system
        pass_filenames: false
        files: ^(src/dr_core/|tests/test_contract\.py)
